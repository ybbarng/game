name: Image

# 정적 사이트 이미지를 빌드해 GHCR 에 올리고 서버에 배포한다. 서버는 이미지를 받아 띄우기만 한다.
#   ghcr.io/ybbarng/game — nginx + 정적 빌드(Dockerfile 의 runner)
#   ghcr.io/ybbarng/stardraw-server — 하늘의 별 따기 회차 서버(변수 STARDRAW_SERVER_IMAGE=true 일 때만, 배포는 손으로)
# 태그: 커밋 sha 는 항상, main 이면 latest 도.
# 서버 쪽 compose.yaml·deploy.sh 는 servers 저장소의 byb.kr/apps/game/ 에 있다.

# CI(단위·화면 시험)가 main 에서 성공한 뒤에만 빌드하고 배포한다(2026-10-30). 무거운 전체 화면 시험을
# 개발 맥 대신 CI 가 맡고, 깨진 커밋은 사이트에 올라가지 않는다. 빌드할 커밋은 CI 가 확인한 커밋(head_sha)이다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-main
  cancel-in-progress: true

env:
  # CI 가 확인한 커밋. 손으로 돌리면(workflow_dispatch) 지금 main
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  # 정적 빌드라 주소가 빌드할 때 들어간다. 화면 코드 해시 목록(build-hashes.json)에도 그대로 적혀,
  # 누구든 같은 값으로 다시 빌드해 비교할 수 있다(docs/36 11-8)
  NEXT_PUBLIC_SITE_URL: https://game.byb.kr
  NEXT_PUBLIC_UMAMI_WEBSITE_ID: 73d4af92-bdfe-4bcb-945a-cdc440d380f4
  NEXT_PUBLIC_STARDRAW_API: /stardraw-api
  # 데모 /stardraw/demo는 로컬·시험 전용이라 운영 결과물에서 뺀다(2026-11-02 사용자, scripts/drop-demo-pages.mjs).
  # 아래 reproduce 작업도 이 값으로 빌드해 같은 파일 목록이 나온다
  NEXT_PUBLIC_STARDRAW_DEMO: "0"

permissions:
  contents: read
  packages: write

jobs:
  build:
    # 이 저장소 main 에 push 해서 성공한 CI만(포크에서 이름이 main 인 브랜치로 연 PR의 CI가 배포로 이어지지 않게, D5)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/ybbarng/game
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ env.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_STARDRAW_API=${{ env.NEXT_PUBLIC_STARDRAW_API }}
            NEXT_PUBLIC_STARDRAW_DEMO=${{ env.NEXT_PUBLIC_STARDRAW_DEMO }}
            SOURCE_COMMIT=${{ env.SHA }}
          cache-from: type=gha,scope=game
          cache-to: type=gha,scope=game,mode=max
      # 화면 코드 해시 목록(docs/36 11-8). 같은 빌드(캐시)에서 build-hashes.json 만 꺼내
      # 실행 요약과 기록 파일(90일)로 남긴다. 사이트도 같은 파일을 /build-hashes.json 으로 낸다
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: hashes
          outputs: type=local,dest=hashes
          # 위와 같은 값이라 캐시에서 바로 나온다
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ env.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_STARDRAW_API=${{ env.NEXT_PUBLIC_STARDRAW_API }}
            NEXT_PUBLIC_STARDRAW_DEMO=${{ env.NEXT_PUBLIC_STARDRAW_DEMO }}
            SOURCE_COMMIT=${{ env.SHA }}
          cache-from: type=gha,scope=game
      - name: 해시 목록 요약
        run: |
          {
            echo "### 화면 코드 해시 목록"
            echo
            echo "- 커밋 \`$SHA\`"
            echo "- digest \`$(jq -r .digest hashes/build-hashes.json)\` (파일 $(jq '.files | length' hashes/build-hashes.json)개)"
            echo "- 확인: \`pnpm stardraw-verify site https://game.byb.kr\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-hashes
          path: hashes/build-hashes.json
          retention-days: 90

  # 하늘의 별 따기 회차 서버 이미지(ghcr.io/ybbarng/stardraw-server, apps/stardraw-server/Dockerfile).
  # 이미지를 올리면 아래 deploy-server 가 운영 서버에 띄운다(docs/36 11-45).
  # 저장소 변수 STARDRAW_SERVER_IMAGE 를 true 로 켜기 전에는 돌지 않는다.
  server-image:
    if: vars.STARDRAW_SERVER_IMAGE == 'true' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/ybbarng/stardraw-server
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/stardraw-server/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stardraw-server
          cache-to: type=gha,scope=stardraw-server,mode=max

  # 별 따기 서버를 운영에 띄운다(2026-11-02 사용자: 서버 판은 game 이 스스로 배포한다, docs/36 11-45).
  # 서버의 배포 키 stardraw-deploy 는 forced-command 로 servers 저장소 byb.kr/apps/stardraw/deploy.sh 만 실행한다.
  # deploy.sh 가 마감(:15·:35·:55) 앞뒤 2분과 회차가 밀린 동안(behind·pending·sealOverdueSeconds)을 30초씩 기다렸다가
  # (최대 15분, 넘으면 바꾸지 않고 실패) 태그만 바꿔 다시 띄우고 상태 200을 확인한다. 이미지가 공개라 토큰은 넘기지 않는다.
  # 회차 길이를 바꾸면 deploy.sh 의 CLOSE_MINUTES 도 함께 고친다.
  deploy-server:
    needs: server-image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: SSH → stardraw deploy.sh
        env:
          KEY: ${{ secrets.STARDRAW_DEPLOY_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          set -euo pipefail
          # 배포 키를 아직 넣지 않았으면 이미지만 올리고 배포는 건너뛴다
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "STARDRAW_DEPLOY_KEY·SERVER_HOST 시크릿이 없어 별 따기 서버 배포를 건너뛴다"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/stardraw_key
          chmod 600 ~/.ssh/stardraw_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          ssh -i ~/.ssh/stardraw_key -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            "$USER@$HOST" "deploy $SHA" </dev/null
          rm -f ~/.ssh/stardraw_key

  # 재현 빌드 확인(docs/36 11-8): Docker 밖(보통 러너, Node + pnpm)에서 같은 커밋·같은 빌드 변수로 다시 빌드해
  # 이미지 안 해시 목록과 digest 가 같은지 본다. 배포를 막지는 않는다(실패하면 이 작업만 빨갛게 남는다).
  reproduce:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ env.SHA }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @game/web build
        env:
          SOURCE_COMMIT: ${{ env.SHA }}
          NEXT_TELEMETRY_DISABLED: 1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-hashes
          path: image-hashes
      - name: 이미지의 해시 목록과 비교
        run: |
          set -euo pipefail
          pnpm --filter @game/stardraw-cli build
          node packages/stardraw-cli/dist/stardraw-verify.mjs site \
            --hashes image-hashes/build-hashes.json --build apps/web/out --no-download --all

  # 해시 목록을 GitHub 릴리스(site-<커밋 앞 12자리>)에 남긴다(docs/36 11-8). 바깥에 새로 공개하는 일이라
  # 저장소 변수 STARDRAW_PUBLISH_HASHES 를 true 로 켜기 전에는 돌지 않는다. 릴리스는 지우면 그만이라 되돌리기 쉽다.
  publish-hashes:
    if: vars.STARDRAW_PUBLISH_HASHES == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: build-hashes
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="site-${SHA:0:12}"
          digest=$(jq -r .digest build-hashes.json)
          notes="game.byb.kr 에 배포한 커밋 $SHA 의 화면 코드 해시 목록. digest $digest. 확인 방법은 docs/36 11-8."
          # 같은 이름의 릴리스가 이미 있으면(다시 돌리기, GitHub 오류로 임시 릴리스만 남은 경우) 파일을 덮어쓰고 정식으로 바꾼다
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" build-hashes.json --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false --notes "$notes"
          else
            gh release create "$tag" build-hashes.json --repo "$GITHUB_REPOSITORY" --target "$SHA" \
              --title "사이트 화면 코드 $tag" --latest=false --notes "$notes"
          fi

  # 서버에 배포한다. 서버의 배포 키는 forced-command 로 servers 저장소의 apps/game/deploy.sh 만 실행한다.
  # 이미지를 받을 토큰은 이 실행의 GITHUB_TOKEN 을 표준입력으로 넘긴다(서버에 남지 않고, 실행이 끝나면 만료된다).
  # CI 가 성공한 main 커밋만 오므로 늘 운영 배포다(빌드가 건너뛰어지면 배포도 건너뛴다).
  # 웹은 별 따기 서버 배포가 끝난 뒤에 올린다(새 화면이 옛 서버를 만나지 않게). 서버 이미지를 만들지 않았거나
  # (변수 꺼짐) 배포 키가 없어 건너뛴 경우에도 웹은 올리고, 서버 배포가 실패하거나 취소되면 웹도 올리지 않는다.
  deploy:
    needs: [build, deploy-server]
    if: always() && needs.build.result == 'success' && (needs.deploy-server.result == 'success' || needs.deploy-server.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: SSH → deploy.sh
        env:
          KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          PORT: ${{ secrets.SERVER_PORT || '22' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 서버 호스트 키(known_hosts 한 줄). 넣어 두면 그 키만 믿고, 없으면 처음 보는 대로 믿는다(D6)
          HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
          MODE: deploy
        run: |
          set -euo pipefail
          # 배포 키를 아직 넣지 않았으면(서버 준비 전) 이미지만 올리고 배포는 건너뛴다
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "SERVER_SSH_KEY·SERVER_HOST 시크릿이 없어 배포를 건너뛴다"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          fi
          printf '%s\n' "$TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes \
            "$USER@$HOST" "$MODE $SHA"
          rm -f ~/.ssh/deploy_key
