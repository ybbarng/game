name: CI

on:
  push:
    branches: [main]
  pull_request:

# 짧은 사이에 여러 번 올리면 앞선 실행을 취소하고 마지막 것만 돌린다(사용 시간 절약).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 시험 안의 의존 패키지 코드가 저장소에 쓰지 못하게 읽기 권한만(D6)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # 사람이 보는 출력(default·github-actions)은 그대로 두고, 파일·시험별 시간을 JSON으로도 남긴다.
      # 느린 시험 워크플로(slow-tests.yml)가 이 artifact를 받아 기준과 비교한다
      - run: pnpm test --reporter=default --reporter=github-actions --reporter=json --outputFile.json=test-times/unit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: test-times-unit
          path: test-times/unit.json
          retention-days: 7
      # nginx 설정이 틀리면 사이트 컨테이너가 뜨지 않는다. 운영과 같은 이미지로 문법을 미리 본다
      - name: nginx 설정 검사
        run: docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.31.8-alpine nginx -t

  # 화면 시험을 둘로 나눠 동시에 돌린다. 2026-10-30 시험을 줄여(시간 합 약 1,935초 → 623초, docs/38)
  # 셋에서 둘로 줄였다. 조각마다 설치·빌드를 따로 하므로 조각이 적을수록 CI 사용 시간이 준다.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @game/web exec playwright install --with-deps chrome
      - run: pnpm e2e --shard=${{ matrix.shard }}/2
      # 시험마다 걸린 시간(playwright.config.ts의 json reporter). 느린 시험 워크플로가 받아 본다
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: test-times-e2e-${{ matrix.shard }}
          path: apps/web/test-times/e2e.json
          retention-days: 7
      # 화면 시험이 실패했을 때만 스크린샷을 남긴다. 저장 공간이 차서 올리지 못해도 CI를 실패로 만들지 않는다.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        continue-on-error: true
        with:
          name: e2e-screenshots-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 3
